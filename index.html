<style>
/* Layout: one Jerusalem-stone card floating in deep navy night, tilting in 3D; details and actions below it. Single committed look. */
:root{
  --night:#0d1a33;
  --night-2:#16284a;
  --navy:#1d3466;
  --stone:#efe6d6;
  --stone-ink:#3a3329;
  --gold:#c99a5b;
  --gold-hi:#f1d39a;
  --f-text:"Frank Ruhl Libre","David Libre","Times New Roman",serif;
  --f-label:"Bellefair","Frank Ruhl Libre",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%;overflow-x:clip}
html{overflow-x:hidden}
body{
  margin:0;background:var(--night);color:var(--stone);
  font-family:var(--f-text);direction:rtl;overflow-x:hidden;
  background:radial-gradient(120% 70% at 50% 0%,var(--night-2) 0%,var(--night) 60%);
  background-color:var(--night);
}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;padding-inline:16px;padding-block:28px 56px;display:flex;flex-direction:column;align-items:center;gap:36px}

/* ---------- the card ---------- */
.stage{width:min(100%,460px);perspective:1400px}
.card{
  position:relative;width:100%;aspect-ratio:297.75/419.25;
  transform-style:preserve-3d;
  border-radius:6px;
  animation:arrive 1.6s cubic-bezier(.2,.8,.2,1) both;
  container-type:inline-size;
  cursor:grab;touch-action:pan-y;
}
.card .face{
  position:absolute;inset:0;border-radius:6px;overflow:hidden;
  background:url(face.jpg) center/100% 100% var(--stone);
  box-shadow:0 40px 80px -20px rgba(0,0,0,.65),0 0 0 1px rgba(241,211,154,.25);
}
.card .gloss{
  position:absolute;inset:0;border-radius:6px;pointer-events:none;mix-blend-mode:soft-light;
  background:radial-gradient(60% 45% at var(--gx,30%) var(--gy,20%),rgba(255,255,255,.75),transparent 70%);
}
.card .edge{ /* thickness of the card */
  position:absolute;inset:0;border-radius:6px;background:#b9a98e;transform:translateZ(-6px);
}
@keyframes arrive{
  0%{opacity:0;transform:translateY(60px) rotateX(55deg) rotateZ(-6deg) scale(.85)}
  100%{opacity:1;transform:none}
}

.content{
  position:absolute;inset:0;
  /* text sits inside the stone arch: arch spans ~11%–84% of width */
  padding:0;transform-style:preserve-3d;
}

/* 3D logo: stacked layers give it real thickness */
.logo{position:absolute;transform-style:preserve-3d;
  animation:spin 2.4s .5s cubic-bezier(.3,.7,.2,1) both, sway 7s 3s ease-in-out infinite}
.logo img{position:absolute;inset:0;width:100%;height:100%;backface-visibility:visible}
.logo img.depth{filter:brightness(.45)}
@keyframes spin{0%{opacity:0;transform:translateZ(40px) rotateY(-540deg) scale(.4)}60%{opacity:1}100%{opacity:1;transform:translateZ(40px) rotateY(0) scale(1)}}
@keyframes sway{0%,100%{transform:translateZ(40px) rotateY(0)}50%{transform:translateZ(40px) rotateY(22deg)}}

@keyframes sweep{0%{background-position:150% 0}40%,100%{background-position:-150% 0}}

/* ---------- gates: two stone doors sealed with the family logo ---------- */
.doors{position:absolute;inset:-2px;z-index:5;display:flex;direction:ltr;perspective:1100px;border-radius:6px;
  border:0;padding:0;margin:0;background:none;cursor:pointer;font:inherit;color:inherit;transform:translateZ(1px)}
.doors:focus-visible{outline:2px solid var(--gold-hi);outline-offset:4px}
.door{position:relative;width:50%;height:100%;background:url(doors.jpg) 0 0/200% 100% var(--stone);
  transition:transform 1.5s cubic-bezier(.65,0,.25,1),filter 1.5s ease,opacity .5s ease .95s;backface-visibility:visible;
  box-shadow:inset 0 0 3cqw rgba(58,51,41,.25)}
.door.l{transform-origin:left center;border-radius:6px 0 0 6px}
.door.r{transform-origin:right center;background-position:100% 0;border-radius:0 6px 6px 0}
.door::before{content:"";position:absolute;inset:6cqw 0 6cqw 6cqw;border:.35cqw solid var(--gold);border-right:0;
  border-radius:40cqw 0 0 0/32cqw 0 0 0}
.door.r::before{inset:6cqw 6cqw 6cqw 0;border:.35cqw solid var(--gold);border-left:0;border-radius:0 40cqw 0 0/0 32cqw 0 0}
.seam{position:absolute;inset:6cqw auto 6cqw 50%;width:.35cqw;margin-left:-.175cqw;pointer-events:none;
  background:linear-gradient(180deg,transparent,var(--gold-hi) 20%,#fff6dd 50%,var(--gold-hi) 80%,transparent);
  box-shadow:0 0 3cqw 1cqw rgba(241,211,154,.55);transition:transform 1.2s ease,opacity 1.2s ease .2s}
.seal-wrap{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3cqw;
  pointer-events:none;transition:opacity .45s ease,transform .6s cubic-bezier(.3,1.5,.5,1)}
.seal{width:24cqw;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#fbf6ec,#e6d9c1 70%);
  box-shadow:0 0 0 .8cqw var(--gold),0 0 0 1.6cqw rgba(241,211,154,.35),0 2cqw 4cqw rgba(13,26,51,.4);
  animation:pulse 2.4s ease-in-out infinite}
.seal img{width:62%}
@keyframes pulse{0%,100%{box-shadow:0 0 0 .8cqw var(--gold),0 0 0 1.6cqw rgba(241,211,154,.35),0 2cqw 4cqw rgba(13,26,51,.4)}
  50%{box-shadow:0 0 0 .8cqw var(--gold),0 0 0 3.4cqw rgba(241,211,154,0),0 2cqw 4cqw rgba(13,26,51,.4)}}
.seal-cta{font-family:var(--f-text);font-weight:700;font-size:3.6cqw;color:var(--night);white-space:nowrap;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold));padding:1.4cqw 4.4cqw;border-radius:10cqw;
  box-shadow:0 1cqw 2.5cqw rgba(13,26,51,.3)}
.card.opened .seal-wrap{opacity:0;transform:translate(-50%,-50%) scale(1.25)}
.card.opened .door.l{transform:rotateY(-108deg);filter:brightness(.7);opacity:0}
.card.opened .door.r{transform:rotateY(108deg);filter:brightness(.7);opacity:0}
.card.opened .seam{transform:scaleX(60);opacity:0}
.card.opened .doors{pointer-events:none}
.card:not(.opened) .face,.card:not(.opened) .edge{visibility:hidden}
/* content waits behind the doors until they open */
.card:not(.opened) .rise,.card:not(.opened) .logo,.card:not(.opened) .sweep{animation-play-state:paused}

.strip{position:absolute;display:block;max-width:none;pointer-events:none;user-select:none}
.sweep{position:absolute;pointer-events:none;
  -webkit-mask:url(name.png) center/100% 100% no-repeat;mask:url(name.png) center/100% 100% no-repeat;
  background:linear-gradient(105deg,transparent 35%,rgba(241,211,154,.95) 50%,transparent 65%) -150% 0/250% 100% no-repeat;
  animation:sweep 5s 2.6s ease-in-out infinite}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.9s + var(--i)*.16s)}
@keyframes rise{from{opacity:0;transform:translateY(3cqw)}to{opacity:1;transform:none}}

.hint{font-family:var(--f-label);font-size:.95rem;letter-spacing:.04em;color:rgba(239,230,214,.55);margin:-14px 0 0}

/* ---------- below the card ---------- */
.panel{width:min(100%,460px);display:flex;flex-direction:column;gap:22px;align-items:center;text-align:center}
.eyebrow{font-family:var(--f-label);letter-spacing:.12em;color:var(--gold-hi);font-size:1.05rem;margin:0}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;direction:ltr}
.count div{border:1px solid rgba(201,154,91,.45);border-radius:4px;padding-block:12px 8px;background:rgba(29,52,102,.35)}
.count strong{display:block;font-size:2rem;font-weight:700;color:var(--gold-hi);font-variant-numeric:tabular-nums;line-height:1}
.count span{font-family:var(--f-label);font-size:.95rem;color:rgba(239,230,214,.75)}
.facts{width:100%;display:grid;gap:0;border-top:1px solid rgba(201,154,91,.35)}
.facts div{display:flex;justify-content:space-between;gap:16px;padding-block:12px;border-bottom:1px solid rgba(201,154,91,.35);font-size:1.05rem}
.facts dt{font-family:var(--f-label);color:var(--gold-hi);letter-spacing:.04em}
.facts dd{margin:0;text-align:left}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding-inline:14px;
  border-radius:4px;font-family:var(--f-text);font-size:1.05rem;font-weight:700;text-decoration:none;
  color:var(--night);background:linear-gradient(180deg,var(--gold-hi),var(--gold));
  border:0;cursor:pointer;transition:transform .15s ease, filter .15s ease;
}
.btn.ghost{background:transparent;color:var(--gold-hi);box-shadow:inset 0 0 0 1px var(--gold)}
.btn.wide{grid-column:1/-1}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
.btn:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.btn svg{width:20px;height:20px;flex:none}
.foot{font-family:var(--f-label);font-size:.95rem;color:rgba(239,230,214,.5);margin:0}

/* ---------- song ---------- */
.sound{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;
  width:48px;height:48px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;
  color:var(--night);background:linear-gradient(180deg,var(--gold-hi),var(--gold));box-shadow:0 6px 18px rgba(0,0,0,.45)}
.sound svg{width:22px;height:22px;grid-area:1/1}
.sound:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.sound .on{display:none}
.sound.playing .on{display:block}.sound.playing .off{display:none}
.sound.playing::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--gold-hi);
  animation:ring 1.8s ease-out infinite}
@keyframes ring{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(1.5)}}

@media (prefers-reduced-motion:reduce){
  .card,.logo,.rise,.seal{animation:none!important;opacity:1}
  .door,.seam{transition:opacity .5s ease!important}
  .card.opened .door{transform:none!important;opacity:0}
  .logo{transform:translateZ(40px)}
  .sweep{display:none}
}
</style>
</head>

<script>
(function(){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- 3D logo: stack of layers ---- */
  const logo = document.getElementById('logo');
  const LAYERS = 10;
  for(let i=0;i<LAYERS;i++){
    const img = new Image(); img.src='logo.png'; img.alt='';
    const z = (i-(LAYERS-1))*0.9; // back layers further away
    img.style.transform = `translateZ(${z}px)`;
    if(i<LAYERS-1) img.className='depth';
    logo.appendChild(img);
  }

  /* ---- card tilt: pointer drag + idle float ---- */
  const card = document.getElementById('card'), gloss = document.getElementById('gloss');
  let tx=0, ty=0, cx=0, cy=0, dragging=false, sx=0, sy=0, last=performance.now(), arrived=false;
  setTimeout(()=>{ arrived=true; card.style.animation='none'; card.style.opacity=1; }, reduce?0:1600);

  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  let moved=0;
  card.addEventListener('pointerdown',e=>{dragging=true;moved=0;sx=e.clientX;sy=e.clientY;card.style.cursor='grabbing';last=performance.now();});
  addEventListener('pointermove',e=>{
    if(dragging){ moved=Math.max(moved,Math.hypot(e.clientX-sx,e.clientY-sy)); ty=clamp((e.clientX-sx)*.35,-40,40); tx=clamp(-(e.clientY-sy)*.25,-30,30); last=performance.now(); }
    else if(e.pointerType==='mouse' && card.contains(e.target)){ const r=card.getBoundingClientRect(); ty=((e.clientX-r.left)/r.width-.5)*18; tx=-((e.clientY-r.top)/r.height-.5)*14; last=performance.now(); }
  });
  const end=()=>{dragging=false;card.style.cursor='grab';};
  addEventListener('pointerup',end); addEventListener('pointercancel',end);
  card.addEventListener('pointerleave',()=>{ if(!dragging){tx=0;ty=0;} });

  /* ---- phone tilt (gyroscope) ---- */
  let gyro=false, gtx=0, gty=0, b0=null;
  function onTilt(e){
    if(e.beta==null||e.gamma==null) return;
    if(b0===null) b0=e.beta;
    b0 += (e.beta-b0)*.004;            // slowly re-centre on however the phone is held
    gtx = clamp(-(e.beta-b0)*.45,-12,12);
    gty = clamp(e.gamma*.5,-14,14);
    gyro = true;
  }
  function startTilt(){
    const D = window.DeviceOrientationEvent;
    if(!D || reduce) return;
    if(typeof D.requestPermission==='function'){           // iPhone: ask inside the tap
      D.requestPermission().then(s=>{ if(s==='granted') addEventListener('deviceorientation',onTilt); }).catch(()=>{});
    } else addEventListener('deviceorientation',onTilt);
  }

  /* ---- song: starts with the gates, gold button to pause/resume ---- */
  const song=document.getElementById('song'), snd=document.getElementById('sound');
  song.volume=.85;
  function setPlaying(p){ snd.classList.toggle('playing',p); snd.setAttribute('aria-label',p?'השהיית השיר':'הפעלת השיר'); }
  song.addEventListener('play',()=>setPlaying(true));
  song.addEventListener('pause',()=>setPlaying(false));
  function startMusic(){
    snd.hidden=false;
    const r=song.play(); if(r&&r.catch) r.catch(()=>setPlaying(false));
  }
  snd.addEventListener('click',()=>{ if(song.paused){ const r=song.play(); if(r&&r.catch) r.catch(()=>{}); } else song.pause(); });
  // pause when the guest leaves the page, so the song doesn't keep playing in the background
  document.addEventListener('visibilitychange',()=>{ if(document.hidden && !song.paused){ song.pause(); song.dataset.resume='1'; }
    else if(!document.hidden && song.dataset.resume){ delete song.dataset.resume; song.play().catch(()=>{}); } });

  /* ---- opening the gates ---- */
  const doors=document.getElementById('doors');
  let opened=false;
  function openGates(){
    if(opened) return; opened=true;
    startMusic();
    startTilt();
    card.classList.add('opened');
    doors.setAttribute('aria-hidden','true'); doors.tabIndex=-1;
    setTimeout(()=>{ doors.hidden=true; }, 1700);
  }
  doors.addEventListener('click',()=>{ if(moved<10) openGates(); });

  function frame(t){
    if(arrived && !reduce){
      let gx=tx, gy=ty;
      if(gyro && !dragging && t-last>800){ gx=gtx; gy=gty; }
      else if(!dragging && t-last>1800){ gx = Math.sin(t/2600)*5; gy = Math.sin(t/3400)*9; }
      else if(!dragging){ tx*=.96; ty*=.96; }
      cx += (gx-cx)*.08; cy += (gy-cy)*.08;
      card.style.transform = `rotateX(${cx}deg) rotateY(${cy}deg)`;
      gloss.style.setProperty('--gx', (50 - cy*2.2)+'%');
      gloss.style.setProperty('--gy', (35 + cx*2.2)+'%');
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---- gold particles ---- */
  const cv=document.getElementById('sky'), ctx=cv.getContext('2d');
  let W,H,dpr, parts=[];
  function size(){ dpr=Math.min(2,devicePixelRatio||1); W=cv.width=innerWidth*dpr; H=cv.height=innerHeight*dpr; }
  size(); addEventListener('resize',size);
  const N = reduce?40:90;
  for(let i=0;i<N;i++) parts.push({x:Math.random(),y:Math.random(),r:Math.random()*1.8+.4,v:Math.random()*.00025+.00008,p:Math.random()*6.28,d:Math.random()*.0004-.0002});
  function draw(t){
    ctx.clearRect(0,0,W,H);
    for(const q of parts){
      if(!reduce){ q.y-=q.v; q.x+=q.d+Math.sin(t/2000+q.p)*.00015; if(q.y<-.02){q.y=1.02;q.x=Math.random();} }
      const a=.35+.45*Math.sin(t/700+q.p*3);
      const g=ctx.createRadialGradient(q.x*W,q.y*H,0,q.x*W,q.y*H,q.r*dpr*4);
      g.addColorStop(0,`rgba(241,211,154,${Math.max(0,a)})`); g.addColorStop(1,'rgba(201,154,91,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(q.x*W,q.y*H,q.r*dpr*4,0,6.283); ctx.fill();
    }
    if(!reduce) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  /* ---- countdown to Friday 6.11.26, 15:00 Israel time (UTC+2) ---- */
  const target = Date.parse('2026-11-06T15:00:00+02:00');
  const el = id=>document.getElementById(id);
  const pad=n=>String(n).padStart(2,'0');
  function tick(){
    let s=Math.max(0,Math.floor((target-Date.now())/1000));
    if(s===0){ el('cd-title').textContent='מזל טוב! השמחה התחילה'; }
    el('d').textContent=Math.floor(s/86400); s%=86400;
    el('h').textContent=pad(Math.floor(s/3600)); s%=3600;
    el('m').textContent=pad(Math.floor(s/60)); el('s').textContent=pad(s%60);
  }
  tick(); setInterval(tick,1000);
})();
</script>
